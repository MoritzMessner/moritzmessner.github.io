# Site settings
title: Moritz Messner
description: Moritz Messner – Flutter-Entwickler (iOS, Android, Web)
url: "" # Will be set when deploying to GitHub Pages
baseurl: "" # User page - no baseurl needed

# Author
author:
  name: Moritz Messner
  email: messner.moritz@proton.me
  location: Stuttgart, Deutschland

# Social links
social:
  github: MoritzMessner
  linkedin: moritz-messner-382a6323a

# Build settings
markdown: kramdown
permalink: pretty

# Collections (for pages)
collections:
  pages:
    output: true

# Default front matter
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

# Plugins
plugins:
  - jekyll-seo-tag
